name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  export-android:
    name: Export APK
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: barichello/godot-ci:3.5.2
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Environment info
        run: |
          export HOME=/root
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT ANDROID_HOME=$ANDROID_HOME"
          echo "--- editor settings ---"
          cat /root/.config/godot/editor_settings-3.tres || echo "NO editor_settings-3.tres"
          echo "--- templates ---"
          ls /root/.local/share/godot/templates || echo "NO templates dir"
          echo "--- tools ---"
          which godot jarsigner java keytool || true
          ls -la /root/debug.keystore || echo "NO /root/debug.keystore"

      - name: Export debug APK
        run: |
          export HOME=/root
          mkdir -p build/android
          timeout 600 godot -v --export-debug "Android" build/android/arena-4v4.apk < /dev/null > export.log 2>&1
          echo "godot exit code: $?" >> export.log
          tail -n 100 export.log
          ls -la build/android
          test -f build/android/arena-4v4.apk

      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: export-log
          path: export.log

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: arena-4v4-apk
          path: build/android/arena-4v4.apk
