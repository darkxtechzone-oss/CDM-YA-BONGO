name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  export-android:
    name: Export APK
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: barichello/godot-ci:3.5.2
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Android (SDK + debug keystore)
        run: |
          export HOME=/root
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          if [ -z "$SDK" ] || [ ! -d "$SDK" ]; then
            for d in /usr/lib/android-sdk /opt/android-sdk /usr/local/lib/android/sdk /root/android-sdk /opt/android; do
              if [ -d "$d" ]; then SDK="$d"; break; fi
            done
          fi
          if [ -z "$SDK" ] || [ ! -d "$SDK" ]; then
            P=$(find / -maxdepth 5 -type d -name platform-tools 2>/dev/null | head -n 1)
            if [ -n "$P" ]; then SDK=$(dirname "$P"); fi
          fi
          echo "SDK=$SDK"
          ls "$SDK" || true
          ls "$SDK/build-tools" "$SDK/platforms" 2>/dev/null || true
          JARSIGNER=$(which jarsigner)
          echo "JARSIGNER=$JARSIGNER"
          if [ ! -f /root/debug.keystore ]; then
            keytool -keyalg RSA -genkeypair -alias androiddebugkey -keypass android -keystore /root/debug.keystore -storepass android -dname "CN=Android Debug,O=Android,C=US" -validity 9999 -deststoretype pkcs12
          fi
          mkdir -p /root/.config/godot
          cat > /root/.config/godot/editor_settings-3.tres <<EOT
          [gd_resource type="EditorSettings" format=2]

          [resource]

          export/android/android_sdk_path = "$SDK"
          export/android/debug_keystore = "/root/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          export/android/jarsigner = "$JARSIGNER"
          export/android/adb = "$SDK/platform-tools/adb"
          export/android/force_system_user = false
          export/android/shutdown_adb_on_exit = true
          EOT
          cat /root/.config/godot/editor_settings-3.tres

      - name: Export APK (release, fallback debug)
        run: |
          export HOME=/root
          mkdir -p build/android
          timeout 600 godot -v --export "Android" build/android/arena-4v4.apk < /dev/null > export.log 2>&1
          echo "release exit code: $?" >> export.log
          if [ ! -f build/android/arena-4v4.apk ]; then
            echo "=== release failed, trying debug ===" >> export.log
            timeout 600 godot -v --export-debug "Android" build/android/arena-4v4.apk < /dev/null >> export.log 2>&1
          fi
          tail -n 60 export.log
          ls -la build/android
          test -f build/android/arena-4v4.apk

      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: export-log
          path: export.log

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: arena-4v4-apk
          path: build/android/arena-4v4.apk
