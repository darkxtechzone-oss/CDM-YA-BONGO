name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  export-android:
    name: Export APK
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:3.5.2
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Import resources
        run: HOME=/root timeout 600 godot -v --editor --quit || true

      - name: Export debug APK
        run: |
          mkdir -v -p build/android
          HOME=/root godot -v --export-debug "Android" build/android/arena-4v4.apk
          ls -la build/android

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: arena-4v4-apk
          path: build/android/arena-4v4.apk
